# Included inside either example's server {} block.
root /opt/mivi/site;
index index.html;
include /etc/nginx/mime.types;
default_type application/octet-stream;
autoindex off;
server_tokens off;
etag on;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# No authentication endpoint, proxy_pass, application server or API fallback.
if ($request_method !~ ^(GET|HEAD)$) { return 405; }

location ~ /\. {
    deny all;
}

location / {
    try_files $uri $uri/ =404;
    expires -1;
}

location ~* \.(webp|svg)$ {
    try_files $uri =404;
    expires 7d;
}
